<style>

  :root {
    --bg: #0A0E1A;
    --panel: #121828;
    --panel-alt: #182036;
    --border: #232C42;
    --text: #EAEEF6;
    --muted: #8B96AC;
    --pos: #2FD98A;
    --neg: #FF6B6B;
    --gold: #C9A24B;
    --blue: #4EA8DE;
    --purple: #8E6FD1;
    --pink: #E85D9E;
    --orange: #E8734B;
    --btc: #F7931A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
  .display { font-family: 'Space Grotesk', 'Inter', sans-serif; }

  #root { max-width: 1400px; margin: 0 auto; border-radius: 18px; overflow: hidden; }

  /* ---------- Ticker tape ---------- */
  .marquee-wrap {
    border-bottom: 1px solid var(--border); background: #080B14; overflow: hidden;
    white-space: nowrap; position: relative; padding: 9px 0;
  }
  .marquee-track { display: inline-flex; animation: scroll 42s linear infinite; }
  .marquee-wrap:hover .marquee-track { animation-play-state: paused; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .tick { display: inline-flex; align-items: baseline; gap: 6px; padding: 0 18px; font-size: 12.5px; }
  .tick + .tick { border-left: 1px solid var(--border); }

  /* ---------- Header ---------- */
  .header { padding: 22px 26px 18px 26px; border-bottom: 1px solid var(--border); }
  .eyebrow { color: var(--gold); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
  .title { font-size: 26px; font-weight: 600; margin-top: 4px; letter-spacing: -0.01em; }
  .subtitle { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  /* ---------- Summary strip ---------- */
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
  @media (max-width: 780px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
  .summary-cell { background: var(--panel); padding: 18px 22px; }
  .summary-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .summary-value { font-size: 22px; font-weight: 600; }
  .summary-sub { font-size: 12.5px; margin-top: 4px; display: flex; align-items: center; gap: 4px; }

  /* ---------- Body layout ---------- */
  .body { padding: 24px 26px 30px 26px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .body { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
  .card-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .card-hint { font-size: 11px; color: var(--muted); font-weight: 400; }

  .legend { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: background .15s ease; }
  .legend-row:hover, .legend-row.active { background: var(--panel-alt); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; flex-shrink: 0; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .filter-btn { font-size: 11px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel-alt); color: var(--muted); cursor: pointer; font-family: inherit; }
  .filter-btn.active { border-color: var(--gold); color: var(--text); }

  .donut-wrap { display: flex; align-items: center; gap: 12px; }
  .donut { width: 130px; height: 130px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .donut::after { content: ''; position: absolute; inset: 19%; background: var(--panel); border-radius: 50%; }

  table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th {
    text-align: right; font-weight: 500; color: var(--muted); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .06em; padding: 8px 10px; cursor: pointer; user-select: none; white-space: nowrap; border-bottom: 1px solid var(--border);
  }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl td { text-align: right; padding: 9px 10px; border-bottom: 1px solid #1A2132; white-space: nowrap; }
  .tbl td:first-child { white-space: normal; }
  .tbl tbody tr:hover { background: var(--panel-alt); }

  .editable { background: transparent; border: 1px dashed transparent; border-radius: 5px; padding: 2px 6px; cursor: text; }
  .editable:hover { border-color: var(--muted); }
  .num-input {
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text); border-radius: 6px;
    padding: 3px 6px; font-family: inherit; font-size: 12px; text-align: right;
  }
  .num-input:focus { border-color: var(--gold); outline: none; }

  select.sel { background: var(--panel-alt); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 11.5px; border-radius: 6px; padding: 3px 5px; cursor: pointer; }
  select.sel:hover { border-color: var(--gold); }

  .signal-chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; cursor: default; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--panel-alt); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: var(--gold); }
  .btn-xs { padding: 3px 7px; font-size: 10px; }
  .save-flash { color: var(--pos); font-size: 11.5px; display: flex; align-items: center; gap: 4px; }

  .footnote { font-size: 11px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
  .formula-box { margin-top: 18px; padding: 14px 16px; background: var(--panel-alt); border: 1px solid var(--border); border-radius: 10px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }
  .formula-box b { color: var(--text); }

  .proj-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 4px; }
  @media (max-width: 780px) { .proj-inputs { grid-template-columns: 1fr; } }
  .proj-input-group { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .proj-input-label { font-size: 12px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; }
  .proj-input-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .proj-input-hint { margin-top: 8px; font-size: 10.5px; color: var(--muted); }
  .proj-summary { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 18px; }
  @media (max-width: 1000px) { .proj-summary { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) { .proj-summary { grid-template-columns: repeat(2, 1fr); } }
  .proj-summary-cell { background: var(--panel-alt); padding: 12px 14px; }

  .full-width-section { padding: 0 26px 30px 26px; }

  svg text { font-family: 'IBM Plex Mono', monospace; }
</style>

    <button onclick="doLogin()" style="width:100%;padding:10px;border-radius:8px;border:none;background:#C9A24B;color:#0A0E1A;font-weight:600;cursor:pointer;margin-bottom:8px">Entrar</button>
    <button onclick="doSignup()" style="width:100%;padding:8px;border-radius:8px;border:1px solid #232C42;background:transparent;color:#8B96AC;font-size:12px;cursor:pointer">Criar conta (1ª vez)</button>
    <div id="login-error" style="color:#FF6B6B;font-size:11px;margin-top:10px;display:none"></div>
    <div id="login-status" style="color:#8B96AC;font-size:11px;margin-top:10px">A ligar ao Firebase...</div>
  </div>
</div>
<script>
  // -------------------------------------------------------------------------
  // CONFIGURAÇÃO FIREBASE — substitui pelos valores do teu projeto
  // (Consola Firebase → Definições do projeto → as tuas apps → SDK setup)
  // -------------------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyBp5kxk4MIxdL_qytOWp89Ev1BgwoZ-4oU",
    authDomain: "portefolio-9894a.firebaseapp.com",
    projectId: "portefolio-9894a",
    storageBucket: "portefolio-9894a.firebasestorage.app",
    messagingSenderId: "591999517120",
    appId: "1:591999517120:web:026bbc867b6074f6650825",
  };
  firebase.initializeApp(firebaseConfig);
  const fbAuth = firebase.auth();
  const fbDb = firebase.firestore();
  let currentUser = null;

  function showLoginError(msg) {
    const el = document.getElementById("login-error");
    el.textContent = msg; el.style.display = "block";
  }
  function doLogin() {
    const email = document.getElementById("login-email").value;
    const pw = document.getElementById("login-pw").value;
    fbAuth.signInWithEmailAndPassword(email, pw).catch((err) => showLoginError(traduzErro(err.code)));
  }
  function doSignup() {
    const email = document.getElementById("login-email").value;
    const pw = document.getElementById("login-pw").value;
    if (pw.length < 6) { showLoginError("A password precisa de pelo menos 6 caracteres."); return; }
    fbAuth.createUserWithEmailAndPassword(email, pw).catch((err) => showLoginError(traduzErro(err.code)));
  }
  function traduzErro(code) {
    const map = {
      "auth/invalid-email": "Email inválido.",
      "auth/user-not-found": "Conta não encontrada — usa 'Criar conta'.",
      "auth/wrong-password": "Password errada.",
      "auth/email-already-in-use": "Já existe uma conta com este email — usa 'Entrar'.",
      "auth/weak-password": "Password demasiado fraca (mínimo 6 caracteres).",
      "auth/invalid-credential": "Email ou password incorretos.",
    };
    return map[code] || "Erro: " + code;
  }

  fbAuth.onAuthStateChanged((user) => {
    if (user) {
      currentUser = user;
      document.getElementById("lock-screen").style.display = "none";
      loadFromFirestore();
    } else {
      currentUser = null;
      document.getElementById("login-status").textContent = "";
    }
  });
</script>

// Alguns nomes (Core S&P 500, Core MSCI World) existem em duas posições (Eu/Filhas) —

function findColIndex(headerRow, candidates) {
  for (let i = 0; i < headerRow.length; i++) {
    const cell = String(headerRow[i] || "").toLowerCase();
    if (candidates.some((c) => cell.includes(c))) return i;
  }
  return -1;
}

function parseNumLoose(v) {
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") return v;
  let s = String(v).trim().replace(/[€$%]/g, "").trim();
  // formato europeu (1.234,56) vs formato US (1,234.56) — deteta pela posição da última vírgula/ponto
  const lastComma = s.lastIndexOf(",");
  const lastDot = s.lastIndexOf(".");
  if (lastComma > lastDot) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else {
    s = s.replace(/,/g, "");
  }
  const n = parseFloat(s);
  return Number.isNaN(n) ? null : n;
}

function resolveAmbiguousId(placeholder, volume) {
  if (placeholder === "__SXR8__") {
    // SXR8A (Filhas) tem 0.3351; SXR8B (Eu) tem 0.3 — escolhe o mais próximo
    return Math.abs(volume - 0.3351) < Math.abs(volume - 0.3) ? "SXR8A" : "SXR8B";
  }
  if (placeholder === "__EUNL__") {
    // EUNLF (Filhas) tem 5.2415; EUNL (Eu) tem 1
    return Math.abs(volume - 5.2415) < Math.abs(volume - 1) ? "EUNLF" : "EUNL";
  }
  return placeholder;
}

function handleFileImport(fileInput, mode) {
  mode = mode || "update";
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: "array" });
      // tenta encontrar uma folha com cabeçalhos reconhecíveis; senão usa a primeira
      let rows = null;
      for (const sheetName of wb.SheetNames) {
        const candidate = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true });
        const flatText = candidate.slice(0, 5).map((r) => r.join(" ")).join(" ").toLowerCase();
        if (flatText.includes("instrumento") || flatText.includes("preço atual") || flatText.includes("volume")) {
          rows = candidate;
          break;
        }
      }
      if (!rows) rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true });
      if (mode === "addOnly") importOnlyNewPositions(rows);
      else importPositionsFromRows(rows);
    } catch (err) {
      alert("Não consegui ler este ficheiro. Confirma que é um .csv, .xlsx ou .xls válido.\n\nErro: " + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  fileInput.value = "";
}

// Modo "adicionar só novidades" — nunca atualiza posições já existentes.
// Qualquer linha cujo nome já corresponda a uma posição atual é ignorada;
// só cria posições novas para nomes que ainda não conhecemos.
function importOnlyNewPositions(rows) {
  let headerRowIdx = -1, headerRow = null;
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const rowText = (rows[i] || []).join(" ").toLowerCase();
    if (rowText.includes("instrumento") && (rowText.includes("valor") || rowText.includes("preço"))) {
      headerRowIdx = i; headerRow = rows[i];
      break;
    }
  }
  if (headerRowIdx === -1) {
    alert("Não encontrei um cabeçalho reconhecível. Verifica se exportaste a vista de posições da tua corretora.");
    return;
  }
  const colName = 0;
  const colValor = findColIndex(headerRow, ["valor"]);
  const colVolume = findColIndex(headerRow, ["volume"]);
  const colGanhoPct = findColIndex(headerRow, ["lucro líquido %", "lucro liquido %", "ganho"]);

  let added = 0, ignoradosExistentes = 0; const criadas = [];
  for (let i = headerRowIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row[colName]) continue;
    const nomeOriginal = String(row[colName]);
    const nome = nomeOriginal.toLowerCase();
    const valor = colValor >= 0 ? parseNumLoose(row[colValor]) : null;
    const volume = colVolume >= 0 ? parseNumLoose(row[colVolume]) : null;
    const ganhoPct = colGanhoPct >= 0 ? parseNumLoose(row[colGanhoPct]) : null;
    if (valor === null) continue;

    const found = IMPORT_NAME_MAP.find((m) => nome.includes(m.match));
    const jaExiste = found && state.positions.some((p) => p.id === resolveAmbiguousId(found.id, volume));
    // também verifica por nome direto, para posições que já possam ter sido adicionadas manualmente antes
    const jaExistePorNome = state.positions.some((p) => p.name && p.name.toLowerCase().includes(nome.split(" ")[0]));
    if (jaExiste || jaExistePorNome) { ignoradosExistentes++; continue; }

    const novoCusto = ganhoPct !== null ? valor / (1 + ganhoPct / 100) : valor;
    const id = `custom-${Date.now()}-${added}`;
    state.positions = [...state.positions, {
      id, symbol: nomeOriginal, name: nomeOriginal, category: "Ações",
      shares: volume !== null ? volume : 0, cost: novoCusto, value: valor,
      div: 0, dailyPct: 0, dailyAmt: 0, realizedPct: null, realizedAmt: null,
      conviction: "Média", role: "Satélite", owner: "Eu",
    }];
    criadas.push(nomeOriginal);
    added++;
  }
  persist(); render();
  let msg = `Adicionadas ${added} posições novas.`;
  if (added) msg += `\n\n${criadas.join(", ")}`;
  msg += `\n\n${ignoradosExistentes} linhas ignoradas (já existiam na carteira).`;
  msg += `\n\nNota: as posições novas ficaram com categoria "Ações", titular "Eu" e perfil "Satélite" por omissão — revê e ajusta na tabela.`;
  alert(msg);
}

function importPositionsFromRows(rows) {
  // Formato 1: CSV simples gerado pelo script local (atualizar_precos.py) — id,symbol,price,dailyChangePct
  const firstRowLower = (rows[0] || []).map((c) => String(c || "").toLowerCase());
  if (firstRowLower.includes("id") && firstRowLower.includes("price")) {
    const idxId = firstRowLower.indexOf("id");
    const idxPrice = firstRowLower.indexOf("price");
    const idxDaily = firstRowLower.indexOf("dailychangepct");
    let updated = 0; const naoReconhecidos = [];
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (!row || !row[idxId]) continue;
      const id = String(row[idxId]).trim();
      const price = parseNumLoose(row[idxPrice]);
      const dailyPct = idxDaily >= 0 ? parseNumLoose(row[idxDaily]) : null;
      const pos = state.positions.find((p) => p.id === id);
      if (!pos || price === null) { naoReconhecidos.push(id); continue; }
      const newValue = pos.shares * price;
      const dailyAmt = dailyPct !== null ? newValue - newValue / (1 + dailyPct / 100) : pos.dailyAmt;
      state.positions = state.positions.map((p) => p.id === id ? {
        ...p, value: newValue, dailyPct: dailyPct !== null ? dailyPct : p.dailyPct, dailyAmt,
      } : p);
      updated++;
    }
    persist(); render();
    let msg = `Importação (preços ao vivo) concluída: ${updated} posições atualizadas.`;
    if (naoReconhecidos.length) msg += `\n\nNão reconhecidas: ${naoReconhecidos.join(", ")}`;
    alert(msg);
    return;
  }

  // Formato 2: exportação da corretora (Instrumento/Posição, Valor, Volume, Preço atual, Lucro líquido %)
  // encontra a linha de cabeçalho
  let headerRowIdx = -1, headerRow = null;
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const rowText = (rows[i] || []).join(" ").toLowerCase();
    if (rowText.includes("instrumento") && (rowText.includes("valor") || rowText.includes("preço"))) {
      headerRowIdx = i; headerRow = rows[i];
      break;
    }
  }
  if (headerRowIdx === -1) {
    alert("Não encontrei um cabeçalho reconhecível (esperava colunas como 'Instrumento/Posição', 'Valor', 'Volume', 'Preço atual'). Verifica se exportaste a vista de posições abertas da tua corretora.");
    return;
  }
  const colName = 0; // primeira coluna é sempre o nome do instrumento neste formato
  const colValor = findColIndex(headerRow, ["valor"]);
  const colVolume = findColIndex(headerRow, ["volume"]);
  const colPrecoAtual = findColIndex(headerRow, ["preço atual", "preco atual"]);
  const colGanhoPct = findColIndex(headerRow, ["lucro líquido %", "lucro liquido %", "ganho"]);

  let updated = 0; const naoReconhecidos = [];
  for (let i = headerRowIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || !row[colName]) continue;
    const nome = String(row[colName]).toLowerCase();
    const volume = colVolume >= 0 ? parseNumLoose(row[colVolume]) : null;
    const valor = colValor >= 0 ? parseNumLoose(row[colValor]) : null;
    const ganhoPct = colGanhoPct >= 0 ? parseNumLoose(row[colGanhoPct]) : null;
    if (valor === null) continue;

    const found = IMPORT_NAME_MAP.find((m) => nome.includes(m.match));
    if (!found) { naoReconhecidos.push(row[colName]); continue; }
    const id = resolveAmbiguousId(found.id, volume);
    const pos = state.positions.find((p) => p.id === id);
    if (!pos) { naoReconhecidos.push(row[colName]); continue; }

    const novoCusto = ganhoPct !== null ? valor / (1 + ganhoPct / 100) : pos.cost;
    state.positions = state.positions.map((p) => p.id === id ? {
      ...p,
      value: valor,
      cost: novoCusto,
      shares: volume !== null ? volume : p.shares,
    } : p);
    updated++;
  }
  persist();
  render();
  let msg = `Importação concluída: ${updated} posições atualizadas.`;
  if (naoReconhecidos.length) msg += `\n\nNão reconhecidas (verifica manualmente): ${naoReconhecidos.join(", ")}`;
  alert(msg);
}

let firestoreSaveTimer = null;
function persist() {
  flashSave();
  // grava com um pequeno atraso (debounce) para não sobrecarregar o Firestore com cada tecla
  clearTimeout(firestoreSaveTimer);
  firestoreSaveTimer = setTimeout(saveToFirestore, 600);
}

function saveToFirestore() {
  if (!currentUser) return;
  const overrides = {};
  state.positions.forEach(p => {
    const seed = SEED_FULL.find(s => s.id === p.id);
    if (!seed) { overrides[p.id] = p; return; } // posições novas (custom-...) guardam-se inteiras
    const diff = {}; let changed = false;
    MUTABLE_FIELDS.forEach(f => { if (seed[f] !== p[f]) { diff[f] = p[f]; changed = true; } });
    if (changed) overrides[p.id] = diff;
  });
  fbDb.collection("portfolios").doc(currentUser.uid).set({
    overrides,
    customPositions: state.positions.filter(p => p.id.startsWith("custom-")),
    contributions: state.contributions,
    assumedRates: state.assumedRates,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  }, { merge: true }).catch((err) => console.error("Erro ao gravar no Firestore:", err));
}

async function loadFromFirestore() {
  if (!currentUser) return;
  document.getElementById("login-status").textContent = "";
  try {
    const doc = await fbDb.collection("portfolios").doc(currentUser.uid).get();
    if (doc.exists) {
      const data = doc.data();
      const ov = data.overrides || {};
      state.positions = state.positions.map(p => ov[p.id] ? { ...p, ...ov[p.id] } : p);
      if (data.customPositions) state.positions = [...state.positions, ...data.customPositions];
      if (data.contributions) state.contributions = data.contributions;
      if (data.assumedRates) state.assumedRates = data.assumedRates;
    }
  } catch (e) {
    console.error("Erro ao carregar do Firestore:", e);
  }
  render();
}

function fmtEUR(n, signDisplay) {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  return n.toLocaleString("pt-PT", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2, signDisplay: signDisplay || "auto" });
}
function fmtPct(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  const sign = n > 0 ? "+" : "";
  return `${sign}${n.toFixed(2)}%`;
}
function pctSafe(value, cost) {
  if (!cost || cost === 0) return 0;
  return ((value - cost) / cost) * 100;
}
function isPos(n) { return n >= 0; }

function computeSignal(gainPct, weightPct, conviction) {
  let score = 0; const reasons = [];
  if (gainPct >= 15) { score += 2; reasons.push("ganho > 15%"); }
  else if (gainPct >= 0) { score += 1; reasons.push("ganho positivo"); }
  else if (gainPct >= -15) { score -= 1; reasons.push("perda até 15%"); }
  else { score -= 2; reasons.push("perda > 15%"); }
  score += CONVICTION_SCORE[conviction] ?? 0;
  reasons.push(`convicção ${conviction.toLowerCase()}`);
  if (weightPct >= 8) { score -= 1; reasons.push(`posição concentrada (${weightPct.toFixed(1)}% da carteira)`); }
  if (gainPct <= -15 && conviction === "Baixa") return { label: "Rever / Vender", color: "#FF6B6B", reasons };
  if (score >= 2) return { label: "Reforçar", color: "#2FD98A", reasons };
  if (score <= -2) return { label: "Rever / Vender", color: "#FF6B6B", reasons };
  return { label: "Manter", color: "#E8B84B", reasons };
}

function futureValue(pv, pmt, annualRatePct, months) {
  const r = annualRatePct / 100 / 12;
  if (Math.abs(r) < 1e-9) return pv + pmt * months;
  return pv * Math.pow(1 + r, months) + pmt * ((Math.pow(1 + r, months) - 1) / r);
}

// =============================================================================
// DERIVED DATA
// =============================================================================
function computeTotals() {
  const p = state.positions;
  const cost = p.reduce((s, x) => s + x.cost, 0);
  const value = p.reduce((s, x) => s + x.value, 0);
  const div = p.reduce((s, x) => s + (x.div || 0), 0);
  const dailyAmt = p.reduce((s, x) => s + (x.dailyAmt || 0), 0);
  const gainAmt = value - cost;
  const gainPct = pctSafe(value, cost);
  return { cost, value, div, dailyAmt, gainAmt, gainPct };
}

function computeByKey(key, metaLookup) {
  const map = {};
  state.positions.forEach(p => {
    const k = p[key];
    map[k] = map[k] || { key: k, value: 0, cost: 0 };
    map[k].value += p.value; map[k].cost += p.cost;
  });
  const totals = computeTotals();
  return Object.values(map).map(m => ({
    ...m,
    pct: totals.value ? (m.value / totals.value) * 100 : 0,
    gainPct: pctSafe(m.value, m.cost),
    color: (metaLookup[m.key] || {}).color || "#999",
    label: (metaLookup[m.key] || {}).label || m.key,
  })).sort((a,b) => b.value - a.value);
}

function computeBucketValues() {
  const ppr = state.positions.find(p => p.id === "PPR");
  const pprVal = ppr ? ppr.value : 0;
  const filhaVal = state.positions.filter(p => p.owner === "Filha").reduce((s,p) => s + p.value, 0);
  const totals = computeTotals();
  const euVal = totals.value - pprVal - filhaVal;
  return { ppr: pprVal, filha: filhaVal, eu: euVal };
}

const IDADE_ATUAL = 38;
const MESES_ATE_51 = Math.max(0, (51 - IDADE_ATUAL) * 12);

function futureValuePPR(pv, pmtFase1, pmtFase2, rate, monthsTotal) {
  if (monthsTotal <= MESES_ATE_51) return futureValue(pv, pmtFase1, rate, monthsTotal);
  const fvNaMudanca = futureValue(pv, pmtFase1, rate, MESES_ATE_51);
  return futureValue(fvNaMudanca, pmtFase2, rate, monthsTotal - MESES_ATE_51);
}

function computeProjection() {
  const bv = computeBucketValues();
  const pprPmtFase1 = 1750 / 12;
  const pprPmtFase2 = 1500 / 12;
  const buckets = [
    { key: "ppr",   label: "PPR",              start: bv.ppr,   pmt: pprPmtFase1,               rate: state.assumedRates.ppr,   spread: 1.5, color: "#8E6FD1" },
    { key: "filha", label: "Ações/ETF · Filhas",start: bv.filha, pmt: state.contributions.filha, rate: state.assumedRates.filha, spread: 3.5, color: "#E85D9E" },
    { key: "eu",    label: "Ações/ETF · Eu",   start: bv.eu,    pmt: state.contributions.eu,    rate: state.assumedRates.eu,    spread: 4.0, color: "#4EA8DE" },
  ];
  const data = [];
  for (let y = 0; y <= 20; y++) {
    const m = y * 12;
    const row = { year: y };
    let totalBase = 0, totalLow = 0, totalHigh = 0, totalContrib = 0;
    buckets.forEach(b => {
      if (b.key === "ppr") {
        row[b.key] = futureValuePPR(b.start, pprPmtFase1, pprPmtFase2, b.rate, m);
        totalBase += row[b.key];
        totalLow += futureValuePPR(b.start, pprPmtFase1, pprPmtFase2, b.rate - b.spread, m);
        totalHigh += futureValuePPR(b.start, pprPmtFase1, pprPmtFase2, b.rate + b.spread, m);
        totalContrib += b.start + (m <= MESES_ATE_51 ? pprPmtFase1 * m : pprPmtFase1 * MESES_ATE_51 + pprPmtFase2 * (m - MESES_ATE_51));
      } else {
        row[b.key] = futureValue(b.start, b.pmt, b.rate, m);
        totalBase += row[b.key];
        totalLow += futureValue(b.start, b.pmt, b.rate - b.spread, m);
        totalHigh += futureValue(b.start, b.pmt, b.rate + b.spread, m);
        totalContrib += b.start + b.pmt * m;
      }
    });
    row.totalBase = totalBase; row.totalLow = totalLow; row.totalHigh = totalHigh; row.totalContrib = totalContrib;
    row.gains = Math.max(0, totalBase - totalContrib);
    data.push(row);
  }
  return { data, buckets, final: data[20] };
}

function updateField(id, field, value) {
  state.positions = state.positions.map(p => p.id === id ? { ...p, [field]: value } : p);
  persist(); render();
}

function commitValueEdit(id, inputEl) {
  const num = parseFloat(String(inputEl.value).replace(",", "."));
  if (!Number.isNaN(num) && num >= 0) updateField(id, "value", num);
  state.editingId = null; render();
}

function resetAll() {
  state.positions = SEED_FULL.map(p => ({...p}));
  persist(); render();
}

function toggleSort(key) {
  if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
  else { state.sortKey = key; state.sortDir = "desc"; }
  render();
}

function conicGradient(items) {
  // items: [{value, color}], returns CSS conic-gradient string
  const total = items.reduce((s,i) => s + i.value, 0) || 1;
  let acc = 0; const stops = [];
  items.forEach(i => {
    const start = (acc / total) * 360;
    acc += i.value;
    const end = (acc / total) * 360;
    stops.push(`${i.color} ${start}deg ${end}deg`);
  });
  return `conic-gradient(${stops.join(", ")})`;
}

function cssGroupedBarChart(data, series, height) {
  // series: [{key, color, label}]
  const maxVal = Math.max(1, ...data.flatMap(d => series.map(s => d[s.key] || 0)));
  const barsHtml = data.map(d => {
    const cols = series.map(s => {
      const v = d[s.key] || 0;
      const h = Math.round((v / maxVal) * (height - 24));
      return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:${height-24}px">
        <div title="${s.label}: ${fmtEUR(v)}" style="width:70%;height:${h}px;background:${s.color};border-radius:3px 3px 0 0;min-height:${v>0?2:0}px"></div>
      </div>`;
    }).join("");
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1">
      <div style="display:flex;width:100%;gap:2px;align-items:flex-end">${cols}</div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:4px">${d.year || d.month}</div>
    </div>`;
  }).join("");
  const legend = series.map(s => `<span style="font-size:10.5px;color:var(--muted);margin-right:12px"><span class="dot" style="background:${s.color}"></span>${s.label}</span>`).join("");
  return `<div style="display:flex;align-items:stretch;gap:4px;height:${height}px">${barsHtml}</div><div style="margin-top:8px">${legend}</div>`;
}


function svgBarChart(data, width, height) {
  // data: [{symbol, gainPct}]
  const rowH = 22, gap = 4;
  const chartW = width - 100;
  const maxAbs = Math.max(1, ...data.map(d => Math.abs(d.gainPct)));
  const midX = 70;
  let svg = `<svg viewBox="0 0 ${width} ${data.length * (rowH+gap)}" width="100%" height="${data.length * (rowH+gap)}">`;
  data.forEach((d, i) => {
    const y = i * (rowH + gap);
    const barMaxW = (chartW / 2) - 10;
    const barW = Math.abs(d.gainPct) / maxAbs * barMaxW;
    const color = d.gainPct >= 0 ? "#2FD98A" : "#FF6B6B";
    const x = d.gainPct >= 0 ? midX : midX - barW;
    svg += `<text x="${midX - 8}" y="${y + rowH/2 + 4}" text-anchor="end" font-size="10.5" fill="#EAEEF6">${d.symbol}</text>`;
    svg += `<rect x="${x}" y="${y}" width="${Math.max(barW,1)}" height="${rowH-6}" rx="3" fill="${color}"></rect>`;
    const labelX = d.gainPct >= 0 ? midX + barW + 6 : midX - barW - 6;
    const anchor = d.gainPct >= 0 ? "start" : "end";
    svg += `<text x="${labelX}" y="${y + rowH/2 + 4}" text-anchor="${anchor}" font-size="9.5" fill="#8B96AC">${d.gainPct > 0 ? "+" : ""}${d.gainPct.toFixed(0)}%</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function svgProjectionChart(data, width, height) {
  const padL = 46, padR = 10, padT = 10, padB = 24;
  const w = width - padL - padR, h = height - padT - padB;
  const maxY = Math.max(...data.map(d => d.totalHigh)) * 1.05;
  const x = (i) => padL + (i / (data.length - 1)) * w;
  const y = (v) => padT + h - (v / maxY) * h;

  function pathFor(key) {
    return data.map((d,i) => `${i===0?"M":"L"} ${x(i).toFixed(1)} ${y(d[key]).toFixed(1)}`).join(" ");
  }
  function areaPath(bottomKey, topKey) {
    let d = `M ${x(0).toFixed(1)} ${y(data[0][bottomKey]).toFixed(1)} `;
    data.forEach((row,i) => { d += `L ${x(i).toFixed(1)} ${y(row[topKey]).toFixed(1)} `; });
    for (let i = data.length - 1; i >= 0; i--) { d += `L ${x(i).toFixed(1)} ${y(data[i][bottomKey]).toFixed(1)} `; }
    return d + "Z";
  }

  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">`;
  // gridlines
  for (let g = 0; g <= 4; g++) {
    const gy = padT + (h/4)*g;
    const val = maxY * (1 - g/4);
    svg += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${width-padR}" y2="${gy.toFixed(1)}" stroke="#1A2132" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#8B96AC">€${(val/1000).toFixed(0)}k</text>`;
  }
  // x labels every 5 years
  data.forEach((d,i) => { if (d.year % 5 === 0) svg += `<text x="${x(i).toFixed(1)}" y="${height-6}" text-anchor="middle" font-size="10" fill="#8B96AC">ano ${d.year}</text>`; });

  // stacked areas: contrib (bottom) + gains (top)
  const zero = data.map(d => ({...d, zeroLine: 0}));
  svg += `<path d="${areaPathCustom(data, () => 0, d => d.totalContrib, x, y)}" fill="#4EA8DE" opacity="0.55"></path>`;
  svg += `<path d="${areaPathCustom(data, d => d.totalContrib, d => d.totalBase, x, y)}" fill="#2FD98A" opacity="0.55"></path>`;
  // reference lines
  svg += `<path d="${pathFor("totalHigh")}" fill="none" stroke="#C9A24B" stroke-width="1.5" stroke-dasharray="4 3"></path>`;
  svg += `<path d="${pathFor("totalLow")}" fill="none" stroke="#8B96AC" stroke-width="1.5" stroke-dasharray="4 3"></path>`;
  svg += `</svg>`;
  return svg;
}
function areaPathCustom(data, bottomFn, topFn, x, y) {
  let d = `M ${x(0).toFixed(1)} ${y(bottomFn(data[0])).toFixed(1)} `;
  data.forEach((row,i) => { d += `L ${x(i).toFixed(1)} ${y(topFn(row)).toFixed(1)} `; });
  for (let i = data.length - 1; i >= 0; i--) { d += `L ${x(i).toFixed(1)} ${y(bottomFn(data[i])).toFixed(1)} `; }
  return d + "Z";
}

function toggleOwnerFilter(key) { state.activeOwner = state.activeOwner === key ? null : key; render(); }
function toggleCategoryFilter(key) { state.activeCategory = state.activeCategory === key ? null : key; render(); }
function toggleActivitySort(key) {
  if (state.activitySortKey === key) state.activitySortDir = state.activitySortDir === "asc" ? "desc" : "asc";
  else { state.activitySortKey = key; state.activitySortDir = "desc"; }
  render();
}
function setActivityFilter(v) { state.activityFilterTitular = v; render(); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// =============================================================================
// LIVE BTC PRICE (best effort — falls back silently if blocked/offline)
// =============================================================================
async function fetchBtcPrice() {
  try {
    const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur&include_24hr_change=true");
    const data = await res.json();
    const price = data?.bitcoin?.eur;
    const change24h = data?.bitcoin?.eur_24h_change;
    if (price) {
      state.positions = state.positions.map(p => {
        if (p.id !== "BTC") return p;
        const newValue = BTC_TOTAL_QTY * price;
        const dailyAmt = change24h ? newValue * (change24h / (100 + change24h)) : 0;
        return { ...p, value: newValue, dailyPct: change24h ?? 0, dailyAmt };
      });
      render();
    }
  } catch (e) {
    // sem internet ou CORS bloqueado ao abrir como ficheiro local — mantém o valor de referência
  }
}

loadPersisted();
render();
fetchBtcPrice();
